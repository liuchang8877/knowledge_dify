
    <!DOCTYPE html>
    <html>
    <head>
        <title>用户管理</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            .container {
                width: 80%;
                margin: 0 auto;
                padding: 20px;
            }
            header {
                background-color: #333;
                color: white;
                padding: 10px 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            h1 {
                margin: 0;
            }
            .logout-btn {
                background-color: #f44336;
                color: white;
                border: none;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                text-decoration: none;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                background-color: white;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            th, td {
                padding: 12px 15px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            th {
                background-color: #4CAF50;
                color: white;
            }
            tr:hover {
                background-color: #f5f5f5;
            }
            .add-user-btn {
                display: inline-block;
                background-color: #4CAF50;
                color: white;
                padding: 10px 15px;
                margin: 20px 0;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                text-decoration: none;
            }
            .add-user-form {
                background-color: white;
                padding: 20px;
                margin-top: 20px;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }
            input[type="text"], input[type="password"] {
                width: 100%;
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
                box-sizing: border-box;
            }
            .submit-btn {
                background-color: #4CAF50;
                color: white;
                border: none;
                padding: 10px 15px;
                border-radius: 4px;
                cursor: pointer;
            }
            .success-message {
                background-color: #dff0d8;
                color: #3c763d;
                padding: 10px;
                margin-bottom: 20px;
                border-radius: 4px;
            }
            .knowledge-id {
                max-width: 200px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .knowledge-id:hover {
                overflow: visible;
                white-space: normal;
                word-break: break-all;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>用户管理系统</h1>
            <a href="/admin/logout" class="logout-btn">退出登录</a>
        </header>
        <div class="container">
            {% if message %}
            <div class="success-message">{{ message }}</div>
            {% endif %}
            
            <button id="toggleFormBtn" class="add-user-btn">添加新用户</button>
            
            <div id="addUserForm" class="add-user-form" style="display: none;">
                <h2>添加新用户</h2>
                <form action="/admin/users/add" method="post">
                    <div class="form-group">
                        <label for="new-username">用户名:</label>
                        <input type="text" id="new-username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">密码:</label>
                        <input type="password" id="new-password" name="password" required>
                    </div>
                    <button type="submit" class="submit-btn">添加用户</button>
                </form>
            </div>
            
            <h2>用户列表</h2>
            <table>
                <thead>
                    <tr>
                        <th>用户ID</th>
                        <th>用户名</th>
                        <th>知识库ID</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.user_id }}</td>
                        <td>{{ user.username }}</td>
                        <td class="knowledge-id" title="{{ user.knowledge_id }}">{{ user.knowledge_id }}</td>
                        <td>
                            <a href="/admin/test-kb/{{ user.knowledge_id }}" target="_blank">测试知识库</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <script>
            document.getElementById('toggleFormBtn').addEventListener('click', function() {
                var form = document.getElementById('addUserForm');
                if (form.style.display === 'none') {
                    form.style.display = 'block';
                    this.textContent = '取消添加';
                } else {
                    form.style.display = 'none';
                    this.textContent = '添加新用户';
                }
            });
        </script>
    </body>
    </html>
